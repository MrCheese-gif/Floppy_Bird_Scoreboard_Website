<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>High scores page</title>
	<style>
	    /*<!--CSS here -->*/
		body {
    		background-color: #f4f4f9;
    		font-family: Arial, sans-serif;
		}
	    .container {
    		max-width: 600px;
    		margin: 50px auto;
    		padding: 20px;
    		background-color: #fff;
    		box-shadow: 0 0
    		}

		.h1 {
    		font-size: 2em;
    		text-align: center;
    		margin-bottom: 1rem;
		}
		ul {
			list-style-type: none;
			padding: 0;
		}
		li {
			margin-bottom: .5rem;
			border-bottom: 1px solid grey;
			border-right: 1px solid grey;
			border-top: 1px solid grey;
			border-left: 5px solid greenyellow;
			border-radius: 50px;
			padding: 10px;
			display: flex;
			justify-content: space-between;
			align-items: center;
		}
		li:last-child {
			border-bottom: none;
		}
	</style>
</head>
<body>
    <!-- Actual HTML -->
    <div class="container">
    	<h1>High Scores Page</h1>
    	<ul id="score-list">
           	<li>

           	</li>
    	</ul>
    </div>
</body>
<script>
    console.log("Script active");

    async function loadScoreboard() {
        console.log("Loading scores...");

        const options = {
            method: "GET",
            headers: { "xc-token": "nc_pat_Vk5akSzG3CUJMLUA9wbArpqM9DkFUPQHEMXyPRT7" },
        };

        try {
        // fetch data
            const response = await fetch(
                "https://app.nocodb.com/api/v3/data/px2vuqfkfzvana1/mxrw6250uqdbym2/records?pageSize=25&viewId=vwa5ucwxownaeje9",
                options,
            );

            const data = await response.json();
            console.log("Data fetched:", data);

            // error handling
            if (!data.records) {
                console.error(
                    "No list property found in response payload",
                    data,
                );
                return;
            }

            // Sort descending
            const sorted = data.records.sort((a, b) => b.fields.Score - a.fields.Score);

            // Get the <ul> element and clear it
            const scoreList = document.getElementById("score-list");
            scoreList.innerHTML = "";

            // Build new <li> elements
            sorted.forEach((entry, index) => {
                const li = document.createElement("li");
                li.className = "score-item";

                li.textContent = `${index + 1}. ${entry.fields.Username} - ${entry.fields.Score}`;

                //random color generator
                li.style.backgroundColor = `#${Math.floor(Math.random() * 16777215).toString(16)}`;

                scoreList.appendChild(li);
            });
        } catch (err) {
            console.error("Failed to load scoreboard:", err);
        }
    }

    // Call on page load
    loadScoreboard();
</script>
</html>
